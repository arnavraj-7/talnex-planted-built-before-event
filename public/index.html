<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quick Notes</title></head>
<body>
  <h1>Quick Notes</h1>
  <form id="note-form">
    <input id="note-input" placeholder="Write a note" aria-label="Note text">
    <button type="submit">Save note</button>
  </form>
  <p id="message" role="status"></p>
  <ul id="notes"></ul>
  <script src="app.js"></script>
</body>
</html>
